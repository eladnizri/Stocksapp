<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניתוח מניות</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מניות">
<meta name="theme-color" content="#e3f4ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3e1cdaf110">
</head>
<body>

<div class="app">
  <div class="pages" id="pages">

    <!-- ============================================ market ============= -->
    <section class="page on" id="p-market">
      <div class="head">
        <div>
          <div class="kicker">מצב השוק</div>
          <h1 id="greet">שוק</h1>
        </div>
        <button class="icon-btn" onclick="openSettings()" aria-label="הגדרות">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.6.66 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

      <div class="card">
        <div class="card-h"><span>מדדים מרכזיים</span>
          <span class="sub" id="mktState"></span></div>
        <div class="tk-grid" id="tickers"></div>
        <div class="tk-strip" id="tickersMini"></div>
      </div>

      <div class="card">
        <div class="card-h"><span>רוחב השוק</span>
          <span class="sub">מתוך <span id="bdCount">—</span> מניות</span></div>
        <div id="breadth"><div class="msg">טוען…</div></div>
      </div>

      <div class="card">
        <div class="card-h"><span>כוח סקטורים</span>
          <span class="sub">חציון חודש</span></div>
        <div id="sectors"><div class="msg">טוען…</div></div>
      </div>

      <div class="card">
        <div class="card-h"><span>ניתוח מניה</span></div>
        <div class="search-wrap">
          <input class="search" id="q" type="search" autocomplete="off"
                 placeholder="חפש לפי סימבול או שם חברה…"
                 oninput="onSearch(this.value)">
          <div class="res" id="results"></div>
        </div>
        <div style="margin-top:11px" id="recentWrap"></div>
      </div>
    </section>

    <!-- ============================================ watch ============== -->
    <section class="page" id="p-watch">
      <div class="head">
        <div>
          <div class="kicker">מעקב</div>
          <h1>התראות וסורק</h1>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><span>התראות מחיר</span>
          <span class="sub" id="alertCount"></span></div>
        <div id="alertsList"><div class="msg">אין התראות.</div></div>
        <div style="margin-top:13px">
          <div class="frow">
            <input id="a-sym" placeholder="סימבול" autocomplete="off"
                   style="max-width:110px">
            <select id="a-dir">
              <option value="above">עולה מעל</option>
              <option value="below">יורד מתחת</option>
            </select>
            <input id="a-price" inputmode="decimal" placeholder="מחיר">
          </div>
          <button class="btn" onclick="addAlert()">הוסף התראה</button>
        </div>
        <div class="disc">ההתראות נבדקות בכל פתיחה של האפליקציה. אין התראה
          כשהיא סגורה.</div>
      </div>

      <div class="card">
        <div class="card-h"><span>סורק מניות</span>
          <span class="sub" id="screenCount"></span></div>
        <div class="chips" id="idxChips" style="margin-bottom:9px"></div>
        <div class="chips" id="secChips" style="margin-bottom:13px"></div>
        <div id="savedScreens" style="margin-bottom:13px"></div>
        <div id="filterRows"></div>
        <div class="frow" style="margin-top:4px">
          <button class="btn" onclick="runScreen()">סרוק</button>
          <button class="btn ghost" style="max-width:96px"
                  onclick="saveScreen()">שמור</button>
          <button class="btn ghost" style="max-width:80px"
                  onclick="resetFilters()">נקה</button>
        </div>
        <div id="screenResults" style="margin-top:13px"></div>
      </div>

      <div class="card">
        <div class="card-h"><span>נתונים</span></div>
        <div id="dataStatus"></div>
      </div>
    </section>

  </div>

  <nav class="tabbar" id="tabbar">
    <i class="tab-pill"></i>
    <button class="tab on" data-page="market" onclick="goTab('market')">
      <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
      <span>שוק</span>
    </button>
    <button class="tab" data-page="watch" onclick="goTab('watch')">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span>מעקב</span>
    </button>
  </nav>
</div>

<!-- ============================================== analysis sheet ======== -->
<div class="modal hidden" id="sheet">
  <div class="modal-backdrop" onclick="closeSheet()"></div>
  <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="ניתוח מניה">
    <div class="sheet-grip"></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="app.js?v=aa386bbbb8"></script>
</body>
</html>
