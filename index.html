<style>
:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--ink:#0E1A18;--ink-soft:#3B4A47;--paper:#F3F1E9;--paper-2:#FBFAF5;--line:#DDD8C9;--teal:#0E6E63;--brass:#C0912F;--gain:#1E7A48;--loss:#C0392B;--shadow:0 1px 2px rgba(19,33,31,.04),0 4px 10px rgba(19,33,31,.05),0 12px 28px rgba(19,33,31,.05);--shadow-lift:0 2px 4px rgba(19,33,31,.06),0 10px 24px rgba(19,33,31,.09),0 24px 48px rgba(19,33,31,.08)}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper);color:var(--ink);font-family:"Heebo","Inter",system-ui,sans-serif;height:100%}
body{overflow:hidden}
h1,h2,h3{font-family:"Fraunces","Heebo",serif}
.he{font-family:"Heebo",system-ui,sans-serif}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
a{color:var(--teal);text-decoration:none}
/* Pager */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100dvh;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;width:100%;height:100dvh;overflow-y:auto;scroll-snap-align:center;-webkit-overflow-scrolling:touch;transition:background .6s ease}
.panel::-webkit-scrollbar{display:none}
.inner{max-width:640px;margin:0 auto;padding:0 16px calc(60px + env(safe-area-inset-bottom))}@media(max-width:400px){.inner{padding:0 12px calc(60px + env(safe-area-inset-bottom))}}
body.coaching .dots{opacity:0;pointer-events:none}
.dots{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:9px;z-index:50;background:rgba(251,250,245,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:9px 14px;box-shadow:var(--shadow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.25s;cursor:pointer}
.dot.active{background:var(--teal);width:24px;border-radius:5px}
/* Masthead */
.masthead{padding:calc(14px + env(safe-area-inset-top)) 0 12px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:20}
.masthead .kicker{font-size:11px;letter-spacing:.12em;color:#8A6415;font-weight:700}
.masthead h1{font-size:24px;line-height:1;font-weight:900;margin-top:5px}@media(max-width:500px){.masthead h1{font-size:20px}}
.masthead .date{margin-top:7px;font-size:13px;color:var(--ink-soft);font-weight:500}
.brass-rule{height:3px;background:var(--brass);width:52px;margin-top:12px;border-radius:2px}
.refreshbar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-top:14px}
.updated{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.mkt{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-top:6px}
.mkt.open{color:var(--gain);background:rgba(30,122,72,.1)}
.mkt.closed{color:var(--ink-soft);background:rgba(74,92,88,.1)}
.mkt .dot2{width:6px;height:6px;border-radius:50%;background:currentColor}
.btn{background:var(--teal);color:#fff;padding:11px 17px;border-radius:13px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(11,80,72,.2),0 6px 16px rgba(11,80,72,.22);min-height:44px;transition:transform .12s ease,box-shadow .15s ease}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 1px 2px rgba(11,80,72,.2),0 3px 8px rgba(11,80,72,.18)}
.btn.ghost{background:transparent;color:var(--teal);box-shadow:none;border:1.5px solid var(--line);padding:8px 14px}
.quota{font-family:"Spline Sans Mono",monospace;font-size:11px;font-weight:500;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:4px 9px;direction:ltr;white-space:nowrap;transition:color .3s,border-color .3s}
.quota.warn{color:var(--brass);border-color:rgba(192,145,47,.45)}
.quota.crit{color:var(--loss);border-color:rgba(192,57,43,.45)}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.addrow{display:flex;gap:8px;margin:16px 0 4px}
.addrow input{flex:1;padding:12px 14px;direction:ltr;border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;font-family:"Spline Sans Mono",monospace;font-size:15px;text-transform:uppercase;color:var(--ink)}
.addrow input:focus{outline:none;border-color:var(--teal)}
.toolbar{display:flex;gap:8px;margin-top:10px}
.tool{font-size:12.5px;color:var(--teal);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper-2);display:inline-flex;gap:6px;align-items:center;font-weight:600;min-height:40px}
.tool.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.summary{margin-top:12px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:14px;flex-wrap:wrap}
.summary b{color:var(--ink);font-family:"Spline Sans Mono",monospace}
.summary .up{color:var(--gain)}.summary .down{color:var(--loss)}
.cards{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.grp{display:flex;flex-direction:column;gap:10px}
.grp-h{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 2px;margin-top:6px;border-bottom:1.5px solid var(--line)}
.grp-h span:first-child{font-family:"Fraunces","Heebo",serif;font-size:15px;font-weight:700;color:var(--ink)}
.grp-n{font-size:11px;color:#8A6415;background:rgba(192,145,47,.12);border:1px solid transparent;border-radius:20px;padding:2px 9px;font-weight:600}
.grp-body{display:flex;flex-direction:column;gap:10px}
.earn{display:none;font-size:11.5px;color:#8A6415;font-weight:700;margin-top:3px}
.earn:not(:empty){display:block}
.earn.soon{color:var(--loss)}
.earn-box{background:rgba(192,145,47,.10);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink);margin-bottom:12px;font-weight:500}
.tagbtn{display:none;font-size:15px;width:30px;height:30px;border-radius:8px;align-items:center;justify-content:center;flex:none;background:var(--paper);border:1px solid var(--line)}
body.editing .tagbtn{display:flex}
body.editing.has-groups .handle{display:none}
.hold{display:none;font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-weight:500}
.hold:not(:empty){display:block}
.hold .hq{color:var(--teal);font-weight:700}
.hold b.up{color:var(--gain)}.hold b.down{color:var(--loss)}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.nav-b{font-size:13px;color:var(--teal);font-weight:600;padding:6px 8px;border-radius:8px}
.nav-b:disabled{color:var(--line)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500}
.fld input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:11px;font-family:"Spline Sans Mono",monospace;font-size:17px;background:var(--paper);direction:ltr;text-align:left}
.fld input:focus{outline:none;border-color:var(--teal)}
.sheet-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5;background:rgba(192,145,47,.10);border-radius:9px;padding:8px 10px}
.sheet{position:fixed;inset:0;background:rgba(14,22,20,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:14px;animation:dimIn .2s ease}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
.sheet-card{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:22px;padding:24px 18px 18px;width:100%;max-width:420px;box-shadow:var(--shadow-lift);margin-bottom:env(safe-area-inset-bottom);animation:sheetUp .28s cubic-bezier(.2,.7,.3,1)}
.sheet-card::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:38px;height:4.5px;border-radius:3px;background:var(--line)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}
.tagopt{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.tagopt input{width:18px;height:18px;accent-color:var(--teal)}
.card-wrapper.dragging{position:relative;z-index:30}
.card-wrapper.dragging .card-compact{opacity:.9;box-shadow:0 12px 28px rgba(19,33,31,.18)}
.card-compact{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;cursor:pointer;transition:background .3s,box-shadow .2s,transform .12s ease}
.card-compact:active{background:#f0ede5;transform:scale(.988)}
.card-compact.up{background:rgba(30,122,72,.06)}
.card-compact.down{background:rgba(192,57,43,.06)}
.card-compact.up.sharp{box-shadow:inset -4px 0 0 var(--gain),var(--shadow)}
.card-compact.down.sharp{box-shadow:inset -4px 0 0 var(--loss),var(--shadow)}
.handle{display:none;align-items:center;justify-content:center;width:24px;color:var(--ink-soft);font-size:19px;cursor:grab;touch-action:none;flex:none;margin-left:-4px}
body.editing .handle{display:flex}
body.editing .card-compact{cursor:default}
.logo{width:36px;height:36px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.logo.ph{display:flex;align-items:center;justify-content:center;font-family:"Spline Sans Mono",monospace;font-weight:600;color:var(--teal);font-size:13px}
.idcol{flex:1;min-width:0}
.sym{font-family:"Spline Sans Mono",monospace;font-weight:600;font-size:16px}
.cname{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;font-weight:500}
.pricecol{text-align:end}
.price{font-size:16px;font-weight:600}
.chg{font-size:14px;font-weight:700}
.chg.up{color:var(--gain)}.chg.down{color:var(--loss)}.chg.flat{color:var(--ink-soft)}
.chg.sharp{font-weight:700}
.stale{opacity:.55}
.remove{display:none;color:var(--ink-soft);font-size:17px;width:28px;height:28px;border-radius:8px;align-items:center;justify-content:center;flex:none}
body.editing .remove{display:flex}
.remove:active{background:var(--line)}
.card-details{display:none;background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:-6px}
.card-details.open{display:block;animation:cardIn .24s cubic-bezier(.2,.7,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.card-details .chart{width:100%;height:50px;background:var(--paper);border-radius:12px;padding:6px;box-sizing:border-box;margin-bottom:10px;border:1px solid var(--line)}
.card-details .track{position:relative;height:8px;border-radius:6px;background:linear-gradient(90deg,#E7E2D2,#EFEBDD);margin-top:12px}
.card-details .mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;border:2.5px solid var(--paper-2)}
.mk.open{background:var(--ink-soft)}
.mk.close{background:var(--teal);width:16px;height:16px}
.legend{direction:ltr;display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--ink-soft)}
.legend b{display:block;font-family:"Spline Sans Mono",monospace;color:var(--ink);font-size:13px;font-weight:500;margin-top:2px}
.vol-bar{display:flex;align-items:flex-end;gap:2px;margin-top:10px;height:24px}
.vol-bar .b{background:rgba(14,110,99,.3);border-radius:3px;flex:1;min-width:2px}
.pp{min-height:0}
.pp-w{display:inline-block;font-size:11.5px;color:var(--ink-soft);margin:-6px 0 10px;font-weight:500}
.pp-box{display:flex;align-items:center;gap:9px;margin:-4px 0 12px;padding:8px 11px;border-radius:11px;background:var(--paper);border:1px solid var(--line)}
.pp-box.up{background:rgba(30,122,72,.09);border-color:rgba(30,122,72,.28)}
.pp-box.down{background:rgba(192,57,43,.09);border-color:rgba(192,57,43,.28)}
.pp-l{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.pp-v{font-size:15px;font-weight:700;margin-inline-start:auto}
.pp-c{font-size:12.5px;font-weight:700}
.pp-box.up .pp-c,.pp-box.up .pp-v{color:var(--gain)}
.pp-box.down .pp-c,.pp-box.down .pp-v{color:var(--loss)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.stat{display:flex;justify-content:space-between;font-size:13px}
.stat span{color:var(--ink-soft)}
.stat b{font-family:"Spline Sans Mono",monospace;font-weight:500}
.gap.up b{color:var(--gain)}.gap.down b{color:var(--loss)}
.periods{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.pd-row{display:flex;gap:8px}
.pd{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center}
.pd span{display:block;font-size:11px;color:var(--ink-soft)}
.pd b{display:block;font-size:14px;font-weight:600;margin-top:3px}
.pd b.up{color:var(--gain)}.pd b.down{color:var(--loss)}.pd b.flat{color:var(--ink-soft)}
.pd-spark{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:8px 6px;display:flex;justify-content:center}
.pd-note{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.news{margin-top:14px;display:flex;flex-direction:column;gap:11px;padding-top:14px;border-top:1px solid var(--line)}
.news .item{font-size:13px;line-height:1.45;direction:ltr;text-align:left}
.news .item .h{font-weight:500;color:var(--ink)}
.news .item .m{color:var(--ink-soft);font-size:11.5px;margin-top:3px}
.disclaimer{margin-top:12px;font-size:11px;color:var(--ink-soft);line-height:1.5;background:rgba(192,145,47,.08);border-radius:10px;padding:9px 11px}
.hist{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.hist h4{font-size:12px;color:var(--brass);font-weight:700;margin-bottom:8px}
.hist table{width:100%;border-collapse:collapse;font-family:"Spline Sans Mono",monospace;font-size:12px}

/* ---- Networking ---- */
let bestProxy=parseInt(localStorage.getItem("mr_proxy")||"0")||0;
async function fetchRaw(finUrl,timeoutMs){const order=[bestProxy,...PROXIES.map((_,i)=>i).filter(i=>i!==bestProxy)];let lastErr;for(const i of order){try{const u=PROXIES[i](finUrl);const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),timeoutMs||9000);const r=await fetch(u,{cache:"no-store",signal:ctrl.signal});clearTimeout(t);if(!r.ok){lastErr="HTTP "+r.status;continue;}const txt=await r.text();if(i!==bestProxy){bestProxy=i;localStorage.setItem("mr_proxy",String(i));}return txt;}catch(e){lastErr=e&&e.message?e.message:e;}}throw new Error(lastErr||"failed");}

function yahooToQuote(r){const m=r.meta||{};const ind=(r.indicators&&r.indicators.quote&&r.indicators.quote[0])||{};const cu=m.currency||"USD";const mul=(cu==="ILA"||cu==="GBp")?0.01:1;

 if(c==null||pc==null||!pc)throw new Error("no price");

 return {c:C,pc:PC,o:(o!=null?o*mul:C),h:(hi!=null?hi*mul:C),l:(lo!=null?lo*mul:C),d:C-PC,dp:((C-PC)/PC)*100,v:v||0,_ils:(cu==="ILS"||cu==="ILA"),_cur:cu,_y:m.symbol};}

function emptyQuote(d){return !d||((d.c===0||d.c==null)&&(d.pc===0||d.pc==null));}
async function quote(sym){if(ysymOf(sym))return yahooQuote(sym);
 let d=null,e1=null;
 try{d=await fetchJSON(`${FINNHUB}/quote?symbol=${sym}&token=${getKey()}`);}catch(e){e1=e;}

async function prePost(sym){const ys=ysymOf(sym)||sym;const r=await yahooChart(ys,"interval=1m&range=1d&includePrePost=true");const m=r.meta||{};const tp=m.currentTradingPeriod||{};const now=Math.floor(Date.now()/1000);
 let phase=null,win=null;
 if(tp.pre&&now>=tp.pre.start&&now<tp.pre.end){phase="pre";win=tp.pre;}
 else if(tp.post&&now>=tp.post.start&&now<tp.post.end){phase="post";win=tp.post;}
 if(!phase)return null;
 const ts=r.timestamp||[];const cl=((r.indicators&&r.indicators.quote&&r.indicators.quote[0])||{}).close||[];
 let last=null;for(let i=ts.length-1;i>=0;i--){if(ts[i]>=win.start&&ts[i]<win.end&&cl[i]!=null){last=cl[i];break;}}

 const base=(m.regularMarketPrice!=null?m.regularMarketPrice:m.chartPreviousClose);
 if(base==null||!base)return null;
 return {phase,price:last*mul,dp:((last-base)/base)*100,ils:(cu==="ILS"||cu==="ILA")};}

function coachEls(){document.body.classList.add("coaching");let o=document.getElementById("coach");if(o)return o;
 o=document.createElement("div");o.id="coach";o.innerHTML='<div id="coachHole"></div><div id="coachTip" dir="rtl"></div>';document.body.appendChild(o);
 return o;}

function showStep(){
 const step=tourQueue[tourI];if(!step){if(tourChain){nextChainTour();}else{finishTours();}return;}
 const panel=document.querySelector(".panel");// active scroll
 const target=document.querySelector(step.sel);
 const o=coachEls();const hole=o.querySelector("#coachHole");const tip=o.querySelector("#coachTip");
 if(!target){ // element missing (e.g. empty list) -> skip
   tourI++;return showStep();
 }
 // scroll target into view within its panel
 target.scrollIntoView({block:"nearest",behavior:"auto"});const rr=target.getBoundingClientRect();const vh0=window.innerHeight;if(rr.bottom>vh0*0.55){const sc=target.closest(".panel");if(sc)sc.scrollBy({top:rr.bottom-vh0*0.5,behavior:"auto"});}
 requestAnimationFrame(()=>{
  const r=target.getBoundingClientRect();const pad=8;
  hole.style.top=(r.top-pad)+"px";hole.style.left=(r.left-pad)+"px";hole.style.width=(r.width+pad*2)+"px";hole.style.height=(r.height+pad*2)+"px";
  const total=tourQueue.length;
  tip.innerHTML='<div class="c-step">'+(tourI+1)+' / '+total+'</div><div class="c-title">'+step.title+'</div><div class="c-body">'+step.body+'</div><div class="c-actions"><button class="c-skip" onclick="finishTours()">דלג</button><button class="c-next" onclick="coachNext()">'+(tourI===total-1?(tourChain&&tourChainList.indexOf(tourName)<tourChainList.length-1?"המסך הבא ›":"סיום"):"הבא ›")+'</button></div>';
  // measure the tip for real, then clamp within safe insets
  tip.style.visibility="hidden";tip.classList.add("show");
  const safeTop=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sat"))||0;
  const safeBot=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sab"))||0;
  const vh=window.innerHeight;const th=tip.offsetHeight;const gap=12;const M=10;
  const roomBelow=vh-r.bottom-safeBot;
  let top;
  if(roomBelow>=th+gap){top=r.bottom+gap;}                 // below the hole
  else if(r.top-safeTop>=th+gap){top=r.top-gap-th;}        // above the hole
  else{top=Math.max(safeTop+M, vh-safeBot-th-M);}          // no room: pin to safe bottom
  top=Math.max(safeTop+M, Math.min(top, vh-safeBot-th-M)); // final clamp
  tip.style.top=top+"px";tip.style.bottom="auto";
  tip.style.visibility="visible";
  haptic(8);
 });
}

function tickerRow(label,d,fmtv){if(!d||d.c==null)return `<div class="tk"><div class="tk-l">${label}</div><div class="tk-v mono">\u2014</div></div>`;const cls=d.dp>0?"up":d.dp<0?"down":"flat";return `<div class="tk"><div class="tk-l">${label}</div><div class="tk-r"><div class="tk-v mono">${fmtv(d.c)}</div><div class="tk-c mono ${cls}">${pct(d.dp||0)}</div></div></div>`;}
async function loadTickers(){const t={};for(const k of homeTk()){t[k]=await tkValue(k);}store.set(LS.tickers,t);renderHome();}

/* ================= REPORT ================= */
/* ================= GROUPS (tags) + EARNINGS ================= */
function getTags(){return store.get(LS.tags,{});}                 // {SYM:[group,...]}
function getGroupOrder(){return store.get(LS.groupOrder,[]);}     // [group,...]
function groupsOf(sym){const t=getTags()[sym];return Array.isArray(t)?t:[];}
function allGroups(){const set=new Set();Object.values(getTags()).forEach(a=>(a||[]).forEach(g=>set.add(g)));const ord=getGroupOrder();const known=ord.filter(g=>set.has(g));set.forEach(g=>{if(!known.includes(g))known.push(g);});return known;}
function setGroupsFor(sym,arr){const t=getTags();if(arr.length)t[sym]=arr;else delete t[sym];store.set(LS.tags,t);const ord=getGroupOrder();arr.forEach(g=>{if(!ord.includes(g))ord.push(g);});store.set(LS.groupOrder,ord.filter(g=>allGroupsRaw(t).includes(g)));}
function allGroupsRaw(t){const set=new Set();Object.values(t).forEach(a=>(a||[]).forEach(g=>set.add(g)));return [...set];}
function grouped(){return allGroups().length>0;}

/* earnings: ONE call per day covers every symbol */
async function loadEarnings(force){const c=store.get(LS.earn,{});if(!force&&c.date===todayISO()&&c.map)return c.map;const from=todayISO();const to=new Date(Date.now()+45*864e5).toISOString().slice(0,10);try{bumpCalls();const raw=await fetchRaw(`${FINNHUB}/calendar/earnings?from=${from}&to=${to}&token=${getKey()}`,15000);const d=JSON.parse(raw);const map={};(d&&d.earningsCalendar||[]).forEach(e=>{if(!e.symbol||!e.date)return;if(!map[e.symbol]||e.date<map[e.symbol].date)map[e.symbol]={date:e.date,hour:e.hour||""};});store.set(LS.earn,{date:todayISO(),map});return map;}catch(e){return (c&&c.map)||{};}}
function daysUntil(iso){const d=new Date(iso+"T00:00:00");const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5);}
function earnLabel(sym){const c=store.get(LS.earn,{});const e=c.map&&c.map[sym];if(!e)return null;const n=daysUntil(e.date);if(n<0||n>45)return null;const txt=n===0?"מדווחת היום":n===1?"מדווחת מחר":`מדווחת בעוד ${n} ימים`;return{txt,n,date:e.date};}
function paintEarnings(){const list=store.get(LS.list,[]);list.forEach(s=>{const e=earnLabel(s.symbol);document.querySelectorAll(`.card-wrapper[data-sym="${s.symbol}"] .js-earn`).forEach(el=>{if(!e){el.textContent="";el.className="js-earn earn";return;}el.textContent="📅 "+e.txt;el.className="js-earn earn"+(e.n<=3?" soon":"");});});}

/* ================= HOLDINGS ================= */
function getHold(){return store.get(LS.hold,{});}                     // {SYM:{q:units, b:buyPrice}}
function holdOf(sym){const x=getHold()[sym];return x&&x.q>0?x:null;}
function setHold(sym,q,b){const all=getHold();if(q>0)all[sym]={q,b:(b>0?b:null)};else delete all[sym];store.set(LS.hold,all);}
function posValue(sym){const x=holdOf(sym);const l=getLast(sym);if(!x||!l||!l.c)return null;return x.q*l.c;}
function portfolioTotals(){const list=store.get(LS.list,[]);let val=0,any=false;list.forEach(s=>{const v=posValue(s.symbol);if(v==null)return;any=true;val+=v;});return any?{val}:null;}

function portfolioDayPct(){const list=store.get(LS.list,[]);let val=0,weighted=0,any=false;list.forEach(s=>{const v=posValue(s.symbol);const l=getLast(s.symbol);if(v==null||!l||l.dp==null||isNaN(l.dp))return;any=true;val+=v;weighted+=v*l.dp;});return (any&&val>0)?(weighted/val):null;}
function renderPortfolio(){store.get(LS.list,[]).forEach(s=>paintHold(s.symbol));const p=portfolioDayPct();const panel=$("#p-home");if(!panel)return;
 if(p==null){panel.style.background="";return;}
 const mag=Math.min(1,Math.abs(p)/2.5);const a=(0.06+mag*0.20).toFixed(3);
 const rgba=p>0?`rgba(30,122,72,${a})`:p<0?`rgba(192,57,43,${a})`:"rgba(0,0,0,0)";
 panel.style.background=`linear-gradient(${rgba},${rgba}), var(--paper)`;}
/* ================= REPORT RENDER ================= */
let UID=0;
function renderApp(list){document.body.classList.toggle("editing",editMode);document.body.classList.toggle("has-groups",grouped());
 $("#app").innerHTML=`<div class="addrow"><input id="addInput" placeholder="הוסף סימול (למשל GOOGL)" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')addSymbol()"><button class="btn ghost" onclick="addSymbol()">הוסף</button></div><div class="msg" id="addMsg" style="display:none"></div><div class="toolbar"><button class="tool" id="sortBtn" onclick="haptic();cycleSort()">מיון: ידני</button><button class="tool" id="editBtn" onclick="haptic();toggleEdit()">עריכה</button></div><div class="summary" id="summary"></div><div class="cards" id="cards"></div>`;
 const cards=$("#cards");
 if(!list.length){cards.innerHTML=`<div class="empty">הרשימה ריקה.<br>הוסף סימול אמריקאי כדי להתחיל.</div>`;return;}
 UID=0;
 if(grouped()){
   let html="";
   allGroups().forEach(g=>{const syms=list.map(s=>s.symbol).filter(sym=>groupsOf(sym).includes(g));if(!syms.length)return;html+=`<div class="grp" data-grp="${escapeHtml(g)}"><div class="grp-h"><span>${escapeHtml(g)}</span><span class="grp-n mono">${syms.length}</span></div><div class="grp-body" data-grp="${escapeHtml(g)}">${syms.map(sym=>compactRow(sym,++UID)).join("")}</div></div>`;});
   const loose=list.map(s=>s.symbol).filter(sym=>!groupsOf(sym).length);
   if(loose.length)html+=`<div class="grp" data-grp=""><div class="grp-h"><span>ללא קבוצה</span><span class="grp-n mono">${loose.length}</span></div><div class="grp-body" data-grp="">${loose.map(sym=>compactRow(sym,++UID)).join("")}</div></div>`;
   cards.innerHTML=html;
 } else {
   cards.innerHTML=`<div class="grp-body" data-grp="">${list.map(s=>compactRow(s.symbol,++UID)).join("")}</div>`;
 }
 const profs=store.get(LS.prof,{});
 list.forEach(s=>{const l=getLast(s.symbol);if(l)paintCompact(s.symbol,l,true);const p=profs[s.symbol];if(p)applyProfile(s.symbol,p);});
 paintEarnings();updateSortBtn();applySort();updateSummary();renderPortfolio();const eb=$("#editBtn");if(eb){eb.textContent=editMode?"סיום":"עריכה";eb.classList.toggle("active",editMode);}
}
function compactRow(sym,uid){const tags=groupsOf(sym);return `<div class="card-wrapper" data-sym="${sym}" data-uid="${uid}"><div class="card-compact" onclick="haptic();rowTap(${uid})"><span class="handle" onpointerdown="dragStart(event,${uid})">≡</span><div class="logo ph js-logo">${sym.slice(0,2)}</div><div class="idcol"><div class="sym">${sym}</div><div class="cname js-cname"></div><span class="js-earn earn"></span><span class="js-hold hold"></span></div><div class="pricecol"><div class="price mono js-price"><span class="skeleton" style="width:60px;height:14px"></span></div><div style="display:flex;flex-direction:column;align-items:flex-end"><div class="chg mono js-chg"><span class="skeleton" style="width:46px;height:11px;margin-top:3px"></span></div><span class="mono js-weekly" style="font-size:12px;color:var(--ink-soft);margin-top:3px;font-weight:500"></span></div></div><button class="tagbtn" onclick="event.stopPropagation();openHold('${sym}')">📦</button><button class="tagbtn" onclick="event.stopPropagation();openTags('${sym}')">🏷</button><button class="remove" onclick="event.stopPropagation();haptic();removeSymbol('${sym}')">✕</button></div><div class="card-details" id="d-${uid}"><div id="b-${uid}"></div></div></div>`;}
function eachRow(sym,fn){document.querySelectorAll(`.card-wrapper[data-sym="${sym}"]`).forEach(fn);}
function applyProfile(sym,p){if(!p)return;eachRow(sym,w=>{if(p.logo){const l=w.querySelector(".js-logo");if(l&&l.tagName!=="IMG")l.outerHTML=`<img class="logo js-logo" src="${p.logo}" alt="" onerror="this.style.display='none'">`;}if(p.name){const c=w.querySelector(".js-cname");if(c)c.textContent=p.name;}});}
async function hydrateProfiles(){const list=store.get(LS.list,[]);const cache=store.get(LS.prof,{});for(const s of list){if(cache[s.symbol]){applyProfile(s.symbol,cache[s.symbol]);continue;}const p=await profile(s.symbol);if(p)applyProfile(s.symbol,p);await new Promise(r=>setTimeout(r,150));}}
function paintHold(sym){const x=holdOf(sym);const t=portfolioTotals();document.querySelectorAll(`.card-wrapper[data-sym="${sym}"] .js-hold`).forEach(el=>{if(!x){el.textContent="";return;}const v=posValue(sym);const wgt=(t&&t.val&&v!=null)?(v/t.val*100):null;el.innerHTML=`<span class="hq">${x.q} יח\u05f3</span>${wgt!=null?` · ${wgt.toFixed(0)}% מהתיק`:""}`;});}
function paintCompact(sym,q,stale){const wch=weeklyChange(sym);paintHold(sym);const sharp=Math.abs(q.dp)>=SHARP;
 eachRow(sym,w=>{const p=w.querySelector(".js-price"),c=w.querySelector(".js-chg"),cc=w.querySelector(".card-compact"),wk=w.querySelector(".js-weekly");
  if(p){p.textContent=cur(q)+fmt(q.c);p.classList.toggle("stale",!!stale);}
  if(wk&&wch!=null){wk.textContent="שבוע "+pct(wch);wk.style.color=wch>0?"var(--gain)":"var(--loss)";}
  if(c){c.textContent=(sharp?"⚡ ":"")+pct(q.dp||0);c.className="chg mono js-chg "+(q.dp>0?"up":q.dp<0?"down":"flat")+(sharp?" sharp":"")+(stale?" stale":"");}
  if(cc){cc.classList.remove("up","down","sharp");if(q.dp>0)cc.classList.add("up");else if(q.dp<0)cc.classList.add("down");if(sharp)cc.classList.add("sharp");}});}
function updateCompact(sym,q){setLast(sym,q);paintCompact(sym,q,false);if(detailData[sym]){detailData[sym].q=q;eachRow(sym,w=>{const uid=w.dataset.uid;if($("#d-"+uid)&&$("#d-"+uid).classList.contains("open"))renderDetail(uid,sym,q,detailData[sym].p,detailData[sym].n);});}}
function updateSummary(){const list=store.get(LS.list,[]);let up=0,down=0,sum=0,n=0;list.forEach(s=>{const l=getLast(s.symbol);if(l&&!isNaN(l.dp)){if(l.dp>0)up++;else if(l.dp<0)down++;sum+=l.dp;n++;}});const el=$("#summary");if(el){if(!n)el.innerHTML="";else{const avg=sum/n;el.innerHTML=`<span><b class="up">${up}</b> עלו</span><span><b class="down">${down}</b> ירדו</span><span>ממוצע <b class="${avg>=0?'up':'down'}">${pct(avg)}</b></span>`;}}renderHome();}
function symOfUid(uid){const w=document.querySelector(`.card-wrapper[data-uid="${uid}"]`);return w?w.dataset.sym:null;}
function rowTap(uid){if(editMode)return;toggleCard(uid);}
function toggleCard(uid){const sym=symOfUid(uid);if(!sym)return;const d=$("#d-"+uid);const willOpen=!d.classList.contains("open");if(willOpen){d.classList.add("open");if(detailData[sym])renderDetail(uid,sym,detailData[sym].q,detailData[sym].p,detailData[sym].n);else{$("#b-"+uid).innerHTML=loaderChart();loadDetail(sym,uid);}}else d.classList.remove("open");}
async function loadDetail(sym,uid){try{const [q,p,n]=await Promise.all([quote(sym),profile(sym),news(sym)]);detailData[sym]={q,p,n};if(p)applyProfile(sym,p);if($("#d-"+uid)&&$("#d-"+uid).classList.contains("open"))renderDetail(uid,sym,q,p,n);loadPrePost(uid,sym);}catch(e){const b=$("#b-"+uid);if(b)b.innerHTML=`<div class="msg">שגיאה בטעינה — הקש על השורה לניסיון חוזר</div>`;delete detailData[sym];}}
function cycleSort(){sortMode=sortMode==="manual"?"change":sortMode==="change"?"az":"manual";localStorage.setItem(LS.sort,sortMode);updateSortBtn();applySort();}
function updateSortBtn(){const b=$("#sortBtn");if(!b)return;b.textContent="מיון: "+(sortMode==="manual"?"ידני":sortMode==="change"?"שינוי ↓":"A–Z");b.classList.toggle("active",sortMode!=="manual");}
function applySort(){document.querySelectorAll(".grp-body").forEach(box=>{const wraps=[...box.children];let sorted;if(sortMode==="change")sorted=wraps.slice().sort((a,b)=>dpOf(b.dataset.sym)-dpOf(a.dataset.sym));else if(sortMode==="az")sorted=wraps.slice().sort((a,b)=>a.dataset.sym.localeCompare(b.dataset.sym));else{const order=store.get(LS.list,[]).map(s=>s.symbol);sorted=wraps.slice().sort((a,b)=>order.indexOf(a.dataset.sym)-order.indexOf(b.dataset.sym));}sorted.forEach(w=>box.appendChild(w));});}
function dpOf(sym){const l=getLast(sym);return l&&!isNaN(l.dp)?l.dp:-Infinity;}
function toggleEdit(){editMode=!editMode;document.body.classList.toggle("editing",editMode);document.body.classList.toggle("has-groups",grouped());$("#editBtn").textContent=editMode?"סיום":"עריכה";$("#editBtn").classList.toggle("active",editMode);if(editMode&&sortMode!=="manual"){sortMode="manual";localStorage.setItem(LS.sort,sortMode);updateSortBtn();applySort();}}
let drag=null;
function dragStart(e,uid){if(!editMode||grouped())return;e.preventDefault();const wrap=document.querySelector(`.card-wrapper[data-uid="${uid}"]`);if(!wrap)return;drag={wrap,box:wrap.parentElement};wrap.classList.add("dragging");window.addEventListener("pointermove",dragMove);window.addEventListener("pointerup",dragEnd);}
function dragMove(e){if(!drag)return;const box=drag.box;const y=e.clientY;for(const w of [...box.children]){if(w===drag.wrap)continue;const r=w.getBoundingClientRect();const mid=r.top+r.height/2;const pos=drag.wrap.compareDocumentPosition(w);if(y<mid&&(pos&Node.DOCUMENT_POSITION_PRECEDING)){box.insertBefore(drag.wrap,w);break;}if(y>mid&&(pos&Node.DOCUMENT_POSITION_FOLLOWING)){box.insertBefore(drag.wrap,w.nextSibling);break;}}}
function dragEnd(){if(!drag)return;drag.wrap.classList.remove("dragging");window.removeEventListener("pointermove",dragMove);window.removeEventListener("pointerup",dragEnd);const order=[...drag.box.children].map(w=>w.dataset.sym);const list=store.get(LS.list,[]);list.sort((a,b)=>order.indexOf(a.symbol)-order.indexOf(b.symbol));store.set(LS.list,list);drag=null;}

/* ---- holdings sheet (continuous: switch symbols without closing) ---- */
function editableSyms(){return store.get(LS.list,[]).map(s=>s.symbol);}
function openHold(sym){closeSheet();const sheet=document.createElement("div");sheet.className="sheet";sheet.id="holdSheet";sheet.innerHTML='<div class="sheet-card" dir="rtl" onclick="event.stopPropagation()" id="holdCard"></div>';sheet.onclick=closeSheet;document.body.appendChild(sheet);renderHoldSheet(sym);}
function renderHoldSheet(sym){const card=$("#holdCard");if(!card)return;const x=getHold()[sym]||{};const syms=editableSyms();const i=syms.indexOf(sym);
 card.innerHTML=`<div class="sheet-nav"><button class="nav-b" ${i<=0?"disabled":""} onclick="saveHoldAnd('${sym}','${syms[i-1]||""}')">‹ הקודמת</button><span class="mono" style="font-weight:600">${sym}</span><button class="nav-b" ${i>=syms.length-1?"disabled":""} onclick="saveHoldAnd('${sym}','${syms[i+1]||""}')">הבאה ›</button></div>
 <label class="fld"><span>כמות יחידות</span><input id="hq" type="number" inputmode="decimal" step="any" min="0" value="${x.q||""}" placeholder="0"></label>
 <div class="sheet-note">הכמות משמשת רק כדי לשקלל את צבע הרקע לפי המשקל האמיתי בתיק. השאר ריק כדי להסיר.</div>
 <div style="display:flex;gap:8px;margin-top:14px"><button class="btn ghost" style="flex:1;justify-content:center" onclick="closeSheet()">ביטול</button><button class="btn" style="flex:2;justify-content:center" onclick="saveHoldAnd('${sym}','')">שמור וסגור</button></div>`;
 setTimeout(()=>{const q=$("#hq");if(q)q.focus();},50);}
function commitHold(sym){const q=parseFloat(($("#hq")||{}).value)||0;setHold(sym,q,0);}
function saveHoldAnd(sym,next){commitHold(sym);haptic();if(next){renderHoldSheet(next);repaintAll();}else{closeSheet();renderApp(store.get(LS.list,[]));}}
function repaintAll(){store.get(LS.list,[]).forEach(s=>{const l=getLast(s.symbol);if(l)paintCompact(s.symbol,l,false);});renderPortfolio();}
function closeSheet(){document.querySelectorAll(".sheet").forEach(s=>s.remove());}

/* ---- tag picker sheet ---- */
function openTags(sym){closeSheet();const mine=groupsOf(sym);const all=allGroups();const syms=editableSyms();const i=syms.indexOf(sym);const opts=all.map(g=>`<label class="tagopt"><input type="checkbox" value="${escapeHtml(g)}" ${mine.includes(g)?"checked":""}><span>${escapeHtml(g)}</span></label>`).join("")||`<div style="font-size:13px;color:var(--ink-soft);padding:6px 0">אין עדיין קבוצות.</div>`;
 const sheet=document.createElement("div");sheet.className="sheet";sheet.id="tagSheet";
 sheet.innerHTML=`<div class="sheet-card" dir="rtl" onclick="event.stopPropagation()"><div class="sheet-nav"><button class="nav-b" ${i<=0?"disabled":""} onclick="saveTagsAnd('${sym}','${"${syms[i-1]||''}"}')">‹ הקודמת</button><span class="mono" style="font-weight:600">${sym}</span><button class="nav-b" ${i>=syms.length-1?"disabled":""} onclick="saveTagsAnd('${sym}','${"${syms[i+1]||''}"}')">הבאה ›</button></div><div id="tagOpts" style="margin-top:12px;display:flex;flex-direction:column;gap:2px">${opts}</div><div style="display:flex;gap:8px;margin-top:14px"><input id="newGrp" placeholder="קבוצה חדשה" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--paper)" onkeydown="if(event.key==='Enter')addGroupInline()"><button class="btn ghost" onclick="addGroupInline()">הוסף</button></div><button class="btn" style="width:100%;justify-content:center;margin-top:16px" onclick="saveTagsAnd('${sym}','')">שמור וסגור</button></div>`;
 sheet.onclick=closeSheet;
 document.body.appendChild(sheet);}
function saveTagsAnd(sym,next){const chosen=[...document.querySelectorAll("#tagOpts input:checked")].map(i=>i.value);setGroupsFor(sym,chosen);haptic();closeSheet();if(next){openTags(next);}else{renderApp(store.get(LS.list,[]));}}
function addGroupInline(){const inp=$("#newGrp");const g=inp.value.trim();if(!g)return;if([...document.querySelectorAll("#tagOpts input")].some(i=>i.value===g)){inp.value="";return;}const box=$("#tagOpts");if(box.querySelector("div"))box.innerHTML="";box.insertAdjacentHTML("beforeend",`<label class="tagopt"><input type="checkbox" value="${escapeHtml(g)}" checked><span>${escapeHtml(g)}</span></label>`);inp.value="";}

async function addSymbol(){const inp=$("#addInput"),msg=$("#addMsg");const sym=inp.value.trim().toUpperCase().replace(/[^A-Z.\-]/g,"");if(!sym)return;const list=store.get(LS.list,[]);if(list.some(s=>s.symbol===sym)){msg.style.display="block";msg.textContent=`${sym} כבר ברשימה.`;return;}msg.style.display="block";msg.style.color="var(--ink-soft)";msg.textContent="בודק…";try{const d=await quote(sym);if(d.c===0&&d.pc===0){msg.style.color="var(--loss)";msg.textContent=`הסימול "${sym}" לא נמצא.`;return;}list.push({symbol:sym});store.set(LS.list,list);inp.value="";msg.style.display="none";renderApp(list);refreshOne(sym);profile(sym).then(p=>p&&applyProfile(sym,p));}catch(e){msg.style.color="var(--loss)";msg.textContent="הבדיקה נכשלה.";}}
async function refreshOne(sym){try{const q=await quote(sym);updateCompact(sym,q);saveSnapshot(sym,q);updateSummary();if(sortMode!=="manual")applySort();}catch(e){renderCardError(sym,"שגיאה");}}
function removeSymbol(sym){const list=store.get(LS.list,[]).filter(s=>s.symbol!==sym);store.set(LS.list,list);const t=getTags();delete t[sym];store.set(LS.tags,t);delete detailData[sym];renderApp(list);updateSummary();}
function drawChart(sym,q){const el=document.getElementById(`chart-${sym}`);if(!el)return;const w=el.offsetWidth,h=el.offsetHeight;const lo=q.l,hi=q.h,range=hi-lo;const y=v=>range>0?h-6-((v-lo)/range)*(h-12):h/2;const pts=[{x:w*0.15,y:y(q.o)},{x:w*0.5,y:y((q.h+q.l)/2)},{x:w*0.85,y:y(q.c)}];const col=q.c>=q.o?"var(--gain)":"var(--loss)";el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%"><polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="${col}" opacity="${i===1?0.5:1}"/>`).join('')}</svg>`;const vol=$("#vol-"+sym);if(vol){vol.innerHTML=Array(5).fill(0).map((_,i)=>{const seed=Math.abs((q.c+q.o+i)*12321)%100;const ht=Math.min(100,Math.max(30,seed*0.8));return `<div class="b" style="height:${ht}%"></div>`;}).join('');}}

><div class="stat"><span>גבוה יומי</span><b>${fmt(q.h)}</b></div><div class="stat"><span>נמוך יומי</span><b>${fmt(q.l)}</b></div></div><div class="news"><div style="font-size:12px;font-weight:600;color:var(--ink)">חדשות</div>${newsHtml}</div><div class="disclaimer">הכותרות הן הקשר בלבד — אי אפשר לדעת בוודאות מה הזיז את המחיר. זה לא ייעוץ השקעות.</div>${historyRows(sym)}`;setTimeout(()=>drawChart(sym,q),0);}

async function grokCall(body){const url="https://api.x.ai/v1/responses";const opts={method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+getGrokKey()},body:JSON.stringify(body)};
 try{const r=await fetch(url,opts);const txt=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+(txt?" "+txt.slice(0,160):""));return JSON.parse(txt);}
 catch(e){try{const p="https://corsproxy.io/?url="+encodeURIComponent(url);const r=await fetch(p,opts);const txt=await r.text();if(!r.ok)throw new Error("HTTP "+r.status);return JSON.parse(txt);}catch(e2){throw e;}}}
function grokExtractText(d){if(!d)return "";if(typeof d.output_text==="string"&&d.output_text.trim())return d.output_text;let out="";
 if(Array.isArray(d.output))d.output.forEach(function(it){const c=it&&it.content;if(Array.isArray(c))c.forEach(function(p){if(p&&typeof p.text==="string")out+=p.text;});else if(it&&typeof it.text==="string")out+=it.text;});
 if(!out&&d.choices&&d.choices[0]&&d.choices[0].message&&typeof d.choices[0].message.content==="string")out=d.choices[0].message.content;
 return out;}
async function grokDailyReport(){const handles=X_ACCOUNTS.map(a=>a.h);const today=new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});const fromDate=new Date(Date.now()-3*864e5).toISOString().slice(0,10);
 const body={model:GROK_MODEL,tools:[{type:"x_search",allowed_x_handles:handles,from_date:fromDate},{type:"web_search"}],input:[
  {role:"system",content:"You are a concise market analyst. Provide ONLY factual, high-impact insights. No fluff. Each bullet point is one key fact or position."},
  {role:"user",content:"Today is "+today+". Summarize ONLY the most important items from these X accounts ("+handles.join(", ")+") and today's market. MAX 2-3 bullets per section.\n\n## 📊 Market Snapshot\n(US market status, key index moves, sentiment)\n\n## 🎯 X Accounts Summary\n(what they're saying today - key trades, concerns, thesis)\n\n## ⚡ Actions & Watch\n(specific tickers mentioned, economic events, critical risks)\n\nBe SHORT and SPECIFIC. Use • for bullets, ## for headers only. No links, no citations."}
 ]};
 const d=await grokCall(body);const text=grokExtractText(d);
 if(!text||!text.trim())throw new Error("תשובה ריקה מ-Grok");return text.trim();}
function grokReportHtml(text){var HE=["📊","📈","📉","🎯","⚡","🔔","💡","📅","🔥","🚨"];
 return String(text||"").split(/\n/).map(function(line){var t=line.trim();if(!t)return "";
 var cleaned=escapeHtml(t).replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").replace(/\[\[\d+\]\]/g,"").replace(/https?:\/\/[^\s]+/g,"");
 var h=cleaned.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/__(.+?)__/g,"<strong>$1</strong>").trim();
 if(!h)return "";
 if(t.indexOf("## ")===0)return '<div class="grok-h">'+h.replace(/^##\s*/,"")+'</div>';
 if(t.indexOf("# ")===0)return '<div class="grok-h">'+h.replace(/^#+\s*/,"")+'</div>';
 for(var k=0;k<HE.length;k++){if(t.indexOf(HE[k])===0)return '<div class="grok-h">'+h+'</div>';}
 if(/^[•\-\*]\s/.test(t))return '<div class="grok-li">'+h.replace(/^[•\-\*]\s+/,"")+'</div>';
 return '<div class="grok-p">'+h+'</div>';}).join("");}
function renderGrokReport(text,cachedDate){const el=$("#grokReport");if(!el)return;const stamp=cachedDate?'<div class="grok-stamp he">עודכן '+escapeHtml(cachedDate)+'</div>':"";el.innerHTML=grokReportHtml(text)+stamp;}
async function loadGrokReport(force){const el=$("#grokReport");if(!el)return;
 if(!getGrokKey()){el.innerHTML='<div class="grok-empty he">הוסף מפתח Grok ב<button class="grok-link" onclick="openSettings()">הגדרות</button> כדי לקבל דוח שוק יומי שמסכם את החשבונות ואת השוק האמריקאי.</div>';return;}
 const c=store.get(LS.grokRep,{});
 if(!force&&c.date===todayISO()&&c.text){renderGrokReport(c.text,c.date);return;}
 el.innerHTML='<div class="empty he">Grok מכין דוח… זה עשוי לקחת מספר שניות.</div>';
 try{const text=await grokDailyReport();store.set(LS.grokRep,{date:todayISO(),text:text});renderGrokReport(text,todayISO());}
 catch(e){const reason=escapeHtml((e&&e.message)||"שגיאה");const old=store.get(LS.grokRep,{});
  if(old.text){el.innerHTML='<div class="msg he" style="margin-bottom:8px">לא הצלחנו לרענן ('+reason+') — מוצג דוח מ־'+escapeHtml(old.date||"")+'. <button class="tool he" onclick="loadGrokReport(true)">נסה שוב</button></div>'+grokReportHtml(old.text);}
  else{el.innerHTML='<div class="msg he">שגיאה בהפקת הדוח: '+reason+'<br><button class="tool he" style="margin-top:8px" onclick="loadGrokReport(true)">נסה שוב</button></div>';}}}

function haptic(duration=10){if(navigator.vibrate)navigator.vibrate(duration);}
function periodChange(sym,days){const snaps=store.get(LS.snap,{})[sym]||[];if(snaps.length<2)return null;const win=snaps.filter(r=>Date.now()-new Date(r.date).getTime()<days*864e5);if(win.length<2)return null;const start=win[0].open,end=win[win.length-1].close;return(start>0)?((end-start)/start*100):null;}
function weeklyChange(sym){return periodChange(sym,7);}
function sparkline(sym,w,ht){const snaps=(store.get(LS.snap,{})[sym]||[]).slice(-10);if(snaps.length<3)return"";const v=snaps.map(r=>r.close).filter(n=>typeof n==="number"&&!isNaN(n));if(v.length<3)return"";const lo=Math.min(...v),hi=Math.max(...v),rg=hi-lo;const pts=v.map((c,i)=>{const x=(i/(v.length-1))*w;const y=rg>0?ht-2-((c-lo)/rg)*(ht-4):ht/2;return x.toFixed(1)+","+y.toFixed(1);}).join(" ");const col=v[v.length-1]>=v[0]?"var(--gain)":"var(--loss)";return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" style="display:block;overflow:visible"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/></svg>`;}
if('serviceWorker'in navigator&&'caches'in window){navigator.serviceWorker.register('data:application/javascript,'+encodeURIComponent(`const CACHE='v2';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(['finnhub','stooq','coingecko','frankfurter'].some(h=>u.hostname.includes(h))){e.respondWith(fetch(e.request).then(r=>r.ok?caches.open(CACHE).then(c=>(c.put(e.request,r.clone()),r)):r).catch(()=>caches.match(e.request).then(m=>m||new Response(JSON.stringify({c:null})))))}else{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))}});`)).catch(()=>{});}

setInterval(()=>{updateMarketBadge();if(!refreshing)paintUpdated(false);},60000);

boot();
