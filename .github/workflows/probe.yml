name: Probe data sources

# Diagnostic only. Run by hand to verify which free endpoints work from a
# runner, and which fields they populate, before relying on them.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/probe_sources.py'
      - 'scripts/probe_browser_apis.py'
      - 'scripts/probe_sector.py'
      - 'scripts/probe_analyst.py'
      - 'scripts/probe_universe.py'
      - 'scripts/probe_ntfy_inbox.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Probe analyst and earnings sources
        run: python scripts/probe_analyst.py
      - name: Probe the client's CORS proxies
        run: python scripts/probe_cors_proxies.py

      # Is a Worker actually necessary, or is there an API the page can call
      # on its own? Only a real Access-Control-Allow-Origin header answers it.
      - name: Probe browser-readable quote APIs
        if: always()
        run: python scripts/probe_browser_apis.py
      - name: Probe server-side quote sources
        if: always()
        run: python scripts/probe_server_quotes.py

      # Can the same endpoint that already supplies sector labels also give
      # the scanner a market cap / volume cutoff for widening the universe
      # beyond S&P 500 + Nasdaq-100, without a request per symbol?
      - name: Probe a wider stock universe
        if: always()
        run: python scripts/probe_universe.py

      # Could ntfy - already installed by everyone who wants alerts - also
      # carry a friend's alert list to the runner, so that sharing the app
      # needs no server, no token and nobody in the middle?
      - name: Probe ntfy as an inbox
        if: always()
        run: python scripts/probe_ntfy_inbox.py
