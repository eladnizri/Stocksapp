name: Probe data sources

# Diagnostic only. Run by hand to verify which free endpoints work from a
# runner, and which fields they populate, before relying on them.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/probe_yahoo.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Probe
        run: python scripts/probe_yahoo.py
