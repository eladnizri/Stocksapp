name: Check price alerts

# This is the alert checker, and it stays in charge until something else is
# proven to be. worker/quotes.js can run the same checks on Cloudflare's
# scheduler, which fires far more reliably than this one - but a migration
# that is not finished must never leave the alerts switched off in between.
#
# Which one sends is decided by a repository variable, not by code:
#
#   ALERTS_OWNER unset or 'github'  -> this workflow sends.  (default)
#   ALERTS_OWNER = 'cloudflare'     -> this workflow refreshes prices only.
#
# Set it only once the Worker has actually delivered a notification. Two
# schedulers with two separate memories of what already fired would send
# everything twice.
#
# HOW THIS ACTUALLY GETS RUN
#
# The real trigger is external: cron-job.org POSTs to this workflow's
# dispatch endpoint every fifteen minutes. See docs/scheduling.md.
#
# That is not belt-and-braces, it is the fix. `on: schedule` is best-effort
# by GitHub's own documentation and has twice gone silent here for many
# hours - not a failed run, no run at all, so nothing reports unhealthy and
# there is nothing to retry. A dispatch call either returns 204 or returns
# an error that shows up in the caller's log, which is the whole point.
#
# The schedule below stays enabled anyway, as free redundancy. A duplicate
# run is harmless: `concurrency` stops two from overlapping, alert_state.json
# stops a notification going out twice, and this repo is public so Actions
# minutes are unlimited.
#
# Times are UTC. US market hours are 13:30-20:00 UTC in summer and
# 14:30-21:00 in winter, so the window below covers both without having to be
# edited twice a year.
#
# Minutes are offset from the hour (3/18/33/48, not 0/15/30/45) on GitHub's
# own advice - the round marks are their busiest. Tried on its own first, and
# measured: three consecutive ticks still failed to fire. Kept because it
# costs nothing, but it was not enough, which is what led to the above.
on:
  schedule:
    - cron: '3,18,33,48 13-21 * * 1-5'
  # GitHub's own scheduler can silently stop delivering cron ticks for days
  # with no error anywhere - it happened here for three days straight,
  # through a full trading day, with the workflow itself reporting healthy
  # the moment it was run by hand. This does not fix that, but it means a
  # newly added or changed alert still gets checked once immediately, rather
  # than waiting on a scheduler that may not be firing at all.
  push:
    branches: [main]
    paths:
      - 'data/alerts.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check and report without sending or saving'
        type: boolean
        default: false
      probe:
        description: 'Health-check one symbol (e.g. AAPL) and stop'
        type: string
        default: ''

permissions:
  contents: write

# A run that overlaps the previous one would read stale state and could send
# the same alert twice.
concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install --quiet requests

      # Runs BEFORE the alert check on purpose: it prices every watched
      # symbol once, and check_alerts.py then reads those numbers instead of
      # asking Nasdaq again. Half the requests, and the price an alert fires
      # on is identical to the one the app displays.
      # Rides along with the alert check rather than getting a schedule of its
      # own: this job already has to run on time for alerts to work at all, and
      # a second cron would be a second thing that can silently stop firing.
      # Skipped for --probe, which is only meant to test one symbol and stop.
      - name: Refresh watched prices
        if: ${{ !inputs.probe }}
        continue-on-error: true
        run: python scripts/build_tickers.py

      # Skipped only once ALERTS_OWNER says Cloudflare is doing this instead.
      # A manual run always checks, so the workflow stays usable for --probe
      # and for testing after the handover.
      - name: Check alerts
        id: check
        if: ${{ vars.ALERTS_OWNER != 'cloudflare' || github.event_name == 'workflow_dispatch' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # An undefined repository variable arrives as an empty string rather
          # than as an absent key, so the script treats empty as unset too.
          # Only override this to point at a self-hosted ntfy.
          NTFY_HOST: ${{ vars.NTFY_HOST }}
        run: |
          python scripts/check_alerts.py \
            ${{ inputs.probe && format('--probe {0}', inputs.probe) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit prices and fired state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/alert_state.json data/tickers.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # [skip ci] keeps this off the stamp workflow's back.
          git commit -m "Update prices [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            git pull --rebase origin main || exit 1
          done
          echo "could not push after 3 attempts"
          exit 1
